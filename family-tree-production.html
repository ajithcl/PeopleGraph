<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FamilyGraph Explorer - Production</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .tree-node {
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .tree-node:hover {
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.8));
        }
        
        .tree-link {
            fill: none;
            stroke: #94a3b8;
            stroke-width: 2px;
        }
        
        .path-highlight {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .scrollbar-thin::-webkit-scrollbar {
            width: 6px;
        }
        
        .scrollbar-thin::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        
        .scrollbar-thin::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Configuration
        const API_BASE_URL = 'http://localhost:8010/api';

        // API Service
        class ApiService {
            async getAllPersons() {
                const response = await fetch(`${API_BASE_URL}/persons`);
                const data = await response.json();
                return data.data || [];
            }

            async getRelationships() {
                const response = await fetch(`${API_BASE_URL}/relationships`);
                const data = await response.json();
                return data.data || [];
            }

            async findShortestPath(personId1, personId2) {
                const response = await fetch(`${API_BASE_URL}/path/${personId1}/${personId2}`);
                const data = await response.json();
                return data.data?.nodeIds || null;
            }

            async addPerson(personData) {
                const response = await fetch(`${API_BASE_URL}/persons`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(personData)
                });
                const data = await response.json();
                return data;
            }

            async updatePerson(id, personData) {
                const response = await fetch(`${API_BASE_URL}/persons/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(personData)
                });
                const data = await response.json();
                return data;
            }

            async addRelationship(fromId, toId, type) {
                const response = await fetch(`${API_BASE_URL}/relationships`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fromId, toId, type })
                });
                const data = await response.json();
                return data;
            }

            async getStats() {
                const response = await fetch(`${API_BASE_URL}/stats`);
                const data = await response.json();
                return data.data || {};
            }

            async searchPersons(query) {
                const response = await fetch(`${API_BASE_URL}/search?query=${encodeURIComponent(query)}`);
                const data = await response.json();
                return data.data || [];
            }
        }

        const apiService = new ApiService();

        // Tree Visualization Component
        function FamilyTree({ data, onNodeClick, highlightPath }) {
            const svgRef = useRef();

            useEffect(() => {
                if (!data || !data.nodes.length) return;

                const width = 1200;
                const height = 800;
                const margin = { top: 40, right: 120, bottom: 40, left: 120 };

                d3.select(svgRef.current).selectAll('*').remove();

                const svg = d3.select(svgRef.current)
                    .attr('width', '100%')
                    .attr('height', height)
                    .attr('viewBox', `0 0 ${width} ${height}`);

                const g = svg.append('g')
                    .attr('transform', `translate(${margin.left},${margin.top})`);

                const rootNodes = data.nodes.filter(node => {
                    return !data.relationships.some(r => 
                        (r.type === 'child_of' && r.from === node.id) ||
                        (r.type === 'has_child' && r.to === node.id)
                    );
                });

                const root = {
                    id: 'root',
                    name: 'Family Tree',
                    children: buildHierarchy(rootNodes[0]?.id || data.nodes[0].id, data)
                };

                const treeLayout = d3.tree()
                    .size([width - margin.left - margin.right, height - margin.top - margin.bottom])
                    .separation((a, b) => (a.parent === b.parent ? 1.5 : 2));

                const hierarchy = d3.hierarchy(root);
                const treeData = treeLayout(hierarchy);

                g.selectAll('.tree-link')
                    .data(treeData.links())
                    .enter()
                    .append('path')
                    .attr('class', 'tree-link')
                    .attr('d', d3.linkVertical()
                        .x(d => d.x)
                        .y(d => d.y));

                const nodes = g.selectAll('.tree-node')
                    .data(treeData.descendants().filter(d => d.data.id !== 'root'))
                    .enter()
                    .append('g')
                    .attr('class', 'tree-node')
                    .attr('transform', d => `translate(${d.x},${d.y})`)
                    .on('click', (event, d) => onNodeClick(d.data));

                nodes.append('rect')
                    .attr('x', -70)
                    .attr('y', -25)
                    .attr('width', 140)
                    .attr('height', 50)
                    .attr('rx', 8)
                    .attr('fill', d => d.data.gender === 'male' ? '#dbeafe' : '#fce7f3')
                    .attr('stroke', d => {
                        if (highlightPath && highlightPath.includes(d.data.id)) {
                            return '#fbbf24';
                        }
                        return d.data.gender === 'male' ? '#3b82f6' : '#ec4899';
                    })
                    .attr('stroke-width', d => highlightPath && highlightPath.includes(d.data.id) ? 4 : 2)
                    .attr('class', d => highlightPath && highlightPath.includes(d.data.id) ? 'path-highlight' : '');

                nodes.append('text')
                    .attr('dy', -5)
                    .attr('text-anchor', 'middle')
                    .attr('font-size', '13px')
                    .attr('font-weight', '600')
                    .attr('fill', '#1e293b')
                    .text(d => d.data.name);

                nodes.append('text')
                    .attr('dy', 12)
                    .attr('text-anchor', 'middle')
                    .attr('font-size', '11px')
                    .attr('fill', '#64748b')
                    .text(d => d.data.dateOfBirth ? new Date(d.data.dateOfBirth).getFullYear() : '');

            }, [data, highlightPath]);

            function buildHierarchy(nodeId, data) {
                const node = data.nodes.find(n => n.id === nodeId);
                if (!node) return [];

                const children = data.relationships
                    .filter(r => r.from === nodeId && r.type === 'has_child')
                    .map(r => {
                        const child = data.nodes.find(n => n.id === r.to);
                        return {
                            ...child,
                            children: buildHierarchy(r.to, data)
                        };
                    });

                return children.length > 0 ? children : undefined;
            }

            return (
                <div className="bg-white rounded-lg shadow-xl p-6 overflow-auto scrollbar-thin">
                    <svg ref={svgRef}></svg>
                </div>
            );
        }

        // Person Profile Modal
        function PersonProfile({ person, onClose, onEdit, relationships, allPersons }) {
            if (!person) return null;

            const calculateAge = (dob) => {
                if (!dob) return 'Unknown';
                const birth = new Date(dob);
                const today = new Date();
                const age = today.getFullYear() - birth.getFullYear();
                return age;
            };

            const getRelationships = () => {
                const rels = relationships.filter(r => r.from === person.id || r.to === person.id);
                return rels.map(r => {
                    const relatedPersonId = r.from === person.id ? r.to : r.from;
                    const relatedPerson = allPersons.find(p => p.id === relatedPersonId);
                    return {
                        type: r.type,
                        person: relatedPerson
                    };
                });
            };

            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                    <div className="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto scrollbar-thin">
                        <div className={`p-6 ${person.gender === 'male' ? 'bg-blue-50' : 'bg-pink-50'}`}>
                            <div className="flex justify-between items-start">
                                <div className="flex items-center space-x-4">
                                    <div className={`w-24 h-24 rounded-full ${person.gender === 'male' ? 'bg-blue-200' : 'bg-pink-200'} flex items-center justify-center text-4xl font-bold ${person.gender === 'male' ? 'text-blue-600' : 'text-pink-600'}`}>
                                        {person.name.split(' ').map(n => n[0]).join('')}
                                    </div>
                                    <div>
                                        <h2 className="text-3xl font-bold text-gray-800">{person.name}</h2>
                                        {person.nickName && (
                                            <p className="text-lg text-gray-600 italic">"{person.nickName}"</p>
                                        )}
                                    </div>
                                </div>
                                <button onClick={onClose} className="text-gray-500 hover:text-gray-700 text-2xl">
                                    <i className="fas fa-times"></i>
                                </button>
                            </div>
                        </div>

                        <div className="p-6 space-y-6">
                            <div className="grid grid-cols-2 gap-4">
                                <div className="bg-gray-50 p-4 rounded-lg">
                                    <p className="text-sm text-gray-500 mb-1">Date of Birth</p>
                                    <p className="text-lg font-semibold text-gray-800">
                                        {person.dateOfBirth ? new Date(person.dateOfBirth).toLocaleDateString() : 'Unknown'}
                                    </p>
                                </div>
                                <div className="bg-gray-50 p-4 rounded-lg">
                                    <p className="text-sm text-gray-500 mb-1">Age</p>
                                    <p className="text-lg font-semibold text-gray-800">
                                        {calculateAge(person.dateOfBirth)} years
                                    </p>
                                </div>
                                <div className="bg-gray-50 p-4 rounded-lg">
                                    <p className="text-sm text-gray-500 mb-1">Gender</p>
                                    <p className="text-lg font-semibold text-gray-800 capitalize">{person.gender}</p>
                                </div>
                                <div className="bg-gray-50 p-4 rounded-lg">
                                    <p className="text-sm text-gray-500 mb-1">ID</p>
                                    <p className="text-lg font-semibold text-gray-800">{person.id}</p>
                                </div>
                            </div>

                            <div>
                                <h3 className="text-xl font-bold text-gray-800 mb-3 flex items-center">
                                    <i className="fas fa-users mr-2 text-indigo-600"></i>
                                    Relationships
                                </h3>
                                <div className="space-y-2">
                                    {getRelationships().length > 0 ? getRelationships().map((rel, idx) => (
                                        <div key={idx} className="flex items-center justify-between bg-indigo-50 p-3 rounded-lg">
                                            <div>
                                                <span className="font-semibold text-gray-800">{rel.person?.name}</span>
                                                <span className="text-sm text-gray-500 ml-2">({rel.type.replace(/_/g, ' ')})</span>
                                            </div>
                                        </div>
                                    )) : (
                                        <p className="text-gray-500 italic">No relationships found</p>
                                    )}
                                </div>
                            </div>

                            <div className="flex space-x-3 pt-4 border-t">
                                <button 
                                    onClick={() => onEdit(person)}
                                    className="flex-1 bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition">
                                    <i className="fas fa-edit mr-2"></i>Edit Profile
                                </button>
                                <button className="flex-1 bg-gray-200 text-gray-700 py-3 rounded-lg font-semibold hover:bg-gray-300 transition">
                                    <i className="fas fa-file-pdf mr-2"></i>Generate Report
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // Path Finder Component
        function PathFinder({ persons, onFindPath }) {
            const [person1, setPerson1] = useState('');
            const [person2, setPerson2] = useState('');

            const handleFind = () => {
                if (person1 && person2 && person1 !== person2) {
                    onFindPath(person1, person2);
                }
            };

            return (
                <div className="bg-white rounded-lg shadow-lg p-6">
                    <h3 className="text-xl font-bold text-gray-800 mb-4 flex items-center">
                        <i className="fas fa-route mr-2 text-green-600"></i>
                        Relationship Path Finder
                    </h3>
                    <div className="grid grid-cols-2 gap-4">
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-2">From</label>
                            <select 
                                value={person1}
                                onChange={(e) => setPerson1(e.target.value)}
                                className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                                <option value="">Select person...</option>
                                {persons.map(p => (
                                    <option key={p.id} value={p.id}>{p.name}</option>
                                ))}
                            </select>
                        </div>
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-2">To</label>
                            <select 
                                value={person2}
                                onChange={(e) => setPerson2(e.target.value)}
                                className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                                <option value="">Select person...</option>
                                {persons.map(p => (
                                    <option key={p.id} value={p.id}>{p.name}</option>
                                ))}
                            </select>
                        </div>
                    </div>
                    <button 
                        onClick={handleFind}
                        disabled={!person1 || !person2 || person1 === person2}
                        className="w-full mt-4 bg-green-600 text-white py-3 rounded-lg font-semibold hover:bg-green-700 transition disabled:bg-gray-300 disabled:cursor-not-allowed">
                        <i className="fas fa-search mr-2"></i>Find Connection Path
                    </button>
                </div>
            );
        }

        // Main App
        function App() {
            const [persons, setPersons] = useState([]);
            const [relationships, setRelationships] = useState([]);
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedPerson, setSelectedPerson] = useState(null);
            const [showProfile, setShowProfile] = useState(false);
            const [highlightPath, setHighlightPath] = useState(null);
            const [pathResult, setPathResult] = useState(null);
            const [loading, setLoading] = useState(true);
            const [stats, setStats] = useState({});
            const [error, setError] = useState(null);

            useEffect(() => {
                loadData();
            }, []);

            async function loadData() {
                setLoading(true);
                setError(null);
                try {
                    const [personsData, relationshipsData, statsData] = await Promise.all([
                        apiService.getAllPersons(),
                        apiService.getRelationships(),
                        apiService.getStats()
                    ]);
                    setPersons(personsData);
                    setRelationships(relationshipsData);
                    setStats(statsData);
                } catch (error) {
                    console.error('Error loading data:', error);
                    setError('Failed to connect to the server. Please ensure the backend is running on http://localhost:3000');
                } finally {
                    setLoading(false);
                }
            }

            const filteredPersons = persons.filter(p => 
                p.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                (p.nickName && p.nickName.toLowerCase().includes(searchTerm.toLowerCase()))
            );

            const handleNodeClick = (node) => {
                setSelectedPerson(node);
                setShowProfile(true);
            };

            const handleFindPath = async (personId1, personId2) => {
                try {
                    const path = await apiService.findShortestPath(personId1, personId2);
                    setHighlightPath(path);
                    
                    if (path) {
                        const pathPersons = path.map(id => persons.find(p => p.id === id));
                        setPathResult(pathPersons);
                    } else {
                        setPathResult([]);
                    }
                } catch (error) {
                    console.error('Error finding path:', error);
                    alert('Failed to find path');
                }
            };

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center">
                        <div className="text-center">
                            <div className="animate-spin rounded-full h-16 w-16 border-b-4 border-white mx-auto mb-4"></div>
                            <p className="text-white text-xl font-semibold">Loading Family Tree...</p>
                        </div>
                    </div>
                );
            }

            if (error) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6">
                        <div className="bg-white rounded-2xl shadow-2xl p-8 max-w-md text-center">
                            <i className="fas fa-exclamation-triangle text-6xl text-red-500 mb-4"></i>
                            <h2 className="text-2xl font-bold text-gray-800 mb-4">Connection Error</h2>
                            <p className="text-gray-600 mb-6">{error}</p>
                            <button 
                                onClick={loadData}
                                className="bg-indigo-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-indigo-700 transition">
                                <i className="fas fa-redo mr-2"></i>Retry Connection
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen p-6">
                    <div className="max-w-7xl mx-auto mb-6">
                        <div className="bg-white rounded-2xl shadow-xl p-6">
                            <div className="flex items-center justify-between mb-6">
                                <div>
                                    <h1 className="text-4xl font-bold text-gray-800 flex items-center">
                                        <i className="fas fa-sitemap mr-3 text-indigo-600"></i>
                                        FamilyGraph Explorer
                                    </h1>
                                    <p className="text-gray-600 mt-2">{persons.length} family members connected</p>
                                </div>
                                <button className="bg-indigo-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-indigo-700 transition">
                                    <i className="fas fa-plus mr-2"></i>Add Member
                                </button>
                            </div>

                            <div className="relative">
                                <input
                                    type="text"
                                    placeholder="Search by name or nickname..."
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                    className="w-full p-4 pl-12 border-2 border-gray-200 rounded-lg focus:border-indigo-500 focus:outline-none text-lg"
                                />
                                <i className="fas fa-search absolute left-4 top-5 text-gray-400 text-xl"></i>
                            </div>

                            {searchTerm && (
                                <div className="mt-4 max-h-60 overflow-y-auto scrollbar-thin bg-gray-50 rounded-lg p-2">
                                    {filteredPersons.map(person => (
                                        <div
                                            key={person.id}
                                            onClick={() => handleNodeClick(person)}
                                            className="p-3 hover:bg-white cursor-pointer rounded-lg transition flex items-center justify-between">
                                            <div className="flex items-center space-x-3">
                                                <div className={`w-10 h-10 rounded-full ${person.gender === 'male' ? 'bg-blue-200 text-blue-600' : 'bg-pink-200 text-pink-600'} flex items-center justify-center font-bold`}>
                                                    {person.name.split(' ').map(n => n[0]).join('')}
                                                </div>
                                                <div>
                                                    <p className="font-semibold text-gray-800">{person.name}</p>
                                                    {person.nickName && <p className="text-sm text-gray-500">"{person.nickName}"</p>}
                                                </div>
                                            </div>
                                            <span className="text-sm text-gray-500">
                                                {person.dateOfBirth ? new Date(person.dateOfBirth).getFullYear() : ''}
                                            </span>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>

                    <div className="max-w-7xl mx-auto mb-6">
                        <PathFinder persons={persons} onFindPath={handleFindPath} />
                        
                        {pathResult && (
                            <div className="mt-4 bg-white rounded-lg shadow-lg p-6">
                                {pathResult.length > 0 ? (
                                    <div>
                                        <h4 className="text-lg font-bold text-gray-800 mb-4 flex items-center">
                                            <i className="fas fa-check-circle mr-2 text-green-600"></i>
                                            Connection Found ({pathResult.length} steps)
                                        </h4>
                                        <div className="flex items-center space-x-2 overflow-x-auto pb-2">
                                            {pathResult.map((person, idx) => (
                                                <React.Fragment key={person.id}>
                                                    <div className="flex-shrink-0 text-center">
                                                        <div className={`w-16 h-16 rounded-full ${person.gender === 'male' ? 'bg-blue-200 text-blue-600' : 'bg-pink-200 text-pink-600'} flex items-center justify-center font-bold text-lg mx-auto mb-2`}>
                                                            {person.name.split(' ').map(n => n[0]).join('')}
                                                        </div>
                                                        <p className="text-sm font-semibold text-gray-800 max-w-[100px] truncate">{person.name}</p>
                                                    </div>
                                                    {idx < pathResult.length - 1 && (
                                                        <i className="fas fa-arrow-right text-2xl text-gray-400 flex-shrink-0"></i>
                                                    )}
                                                </React.Fragment>
                                            ))}
                                        </div>
                                    </div>
                                ) : pathResult.length === 0 && (
                                    <div className="text-center text-gray-600">
                                        <i className="fas fa-times-circle text-4xl text-red-500 mb-2"></i>
                                        <p className="font-semibold">No connection found between selected persons</p>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>

                    <div className="max-w-7xl mx-auto">
                        <FamilyTree 
                            data={{ nodes: persons, relationships }}
                            onNodeClick={handleNodeClick}
                            highlightPath={highlightPath}
                        />
                    </div>

                    {showProfile && (
                        <PersonProfile
                            person={selectedPerson}
                            onClose={() => setShowProfile(false)}
                            onEdit={(person) => console.log('Edit:', person)}
                            relationships={relationships}
                            allPersons={persons}
                        />
                    )}

                    <div className="max-w-7xl mx-auto mt-6 grid grid-cols-1 md:grid-cols-4 gap-6">
                        <div className="bg-white rounded-lg shadow-lg p-6 text-center">
                            <i className="fas fa-users text-4xl text-indigo-600 mb-2"></i>
                            <p className="text-3xl font-bold text-gray-800">{stats.totalPersons || 0}</p>
                            <p className="text-gray-600">Total Members</p>
                        </div>
                        <div className="bg-white rounded-lg shadow-lg p-6 text-center">
                            <i className="fas fa-mars text-4xl text-blue-600 mb-2"></i>
                            <p className="text-3xl font-bold text-gray-800">{stats.maleCount || 0}</p>
                            <p className="text-gray-600">Male Members</p>
                        </div>
                        <div className="bg-white rounded-lg shadow-lg p-6 text-center">
                            <i className="fas fa-venus text-4xl text-pink-600 mb-2"></i>
                            <p className="text-3xl font-bold text-gray-800">{stats.femaleCount || 0}</p>
                            <p className="text-gray-600">Female Members</p>
                        </div>
                        <div className="bg-white rounded-lg shadow-lg p-6 text-center">
                            <i className="fas fa-link text-4xl text-green-600 mb-2"></i>
                            <p className="text-3xl font-bold text-gray-800">{stats.totalRelationships || 0}</p>
                            <p className="text-gray-600">Relationships</p>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
