# Production stack: gunicorn API + Caddy HTTPS reverse proxy.
# Neo4j stays private (Aura, a private network, or the Docker host).
#
#   docker compose up --build
#   curl -k https://localhost/health
#
# Local Neo4j Desktop binds localhost only — containers often cannot reach it.
# Use NEO4J_URI=bolt://host.docker.internal:7687 and listen on 0.0.0.0 in Neo4j,
# or run gunicorn on the host (see DEPLOY.md) and keep this file for a VPS.

services:
  api:
    build: .
    expose:
      - "8010"
    env_file:
      - .env
    environment:
      FLASK_DEBUG: "false"
      WEB_CONCURRENCY: "2"
      TRUST_PROXY: "true"
      PORT: "8010"
      NEO4J_URI: ${NEO4J_URI_DOCKER:-bolt://host.docker.internal:7687}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://localhost}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost,https://127.0.0.1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - photo_data:/app/uploads/photos
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  proxy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  mailpit:
    profiles: ["mail"]
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

volumes:
  photo_data:
  caddy_data:
  caddy_config:
