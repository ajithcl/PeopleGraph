<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FamilyGraph Explorer - Photo Upload</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .tree-node {
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tree-node:hover {
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.8));
        }

        .tree-link {
            fill: none;
            stroke: #94a3b8;
            stroke-width: 2px;
        }

        .path-highlight {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .scrollbar-thin::-webkit-scrollbar {
            width: 6px;
        }

        .scrollbar-thin::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        .scrollbar-thin::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 3px;
        }

        .photo-avatar {
            width: 100%;
            height: 100%;
            object-fit: cover;}

        .upload-zone {
            border: 2px dashed #cbd5e1;
            transition: all 0.3s ease;
        }

        .upload-zone:hover {
            border-color: #6366f1;
            background-color: #f0f9ff;
        }

        .upload-zone.drag-over {
            border-color: #6366f1;
            background-color: #dbeafe;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Configuration
        const API_BASE_URL = 'http://localhost:8010';

        // API Service
        class ApiService {
            async getAllPersons() {
                const response = await fetch(`${API_BASE_URL}/api/persons`);
                const data = await response.json();
                return data.data || [];
            }

            async getRelationships() {
                const response = await fetch(`${API_BASE_URL}/api/relationships`);
                const data = await response.json();
                return data.data || [];
            }

            async findShortestPath(personId1, personId2) {
                const response = await fetch(`${API_BASE_URL}/api/path/${personId1}/${personId2}`);
                const data = await response.json();
                return data.data?.nodeIds || null;
            }

            async updatePerson(id, personData) {
                const response = await fetch(`${API_BASE_URL}/api/persons/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(personData)
                });
                const data = await response.json();
                return data;
            }

            async uploadPhoto(personId, file) {
                const formData = new FormData();
                formData.append('photo', file);

                const response = await fetch(`${API_BASE_URL}/api/persons/${personId}/upload-photo`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                return data;
            }

            async deletePhoto(personId) {
                const response = await fetch(`${API_BASE_URL}/api/persons/${personId}/delete-photo`, {
                    method: 'DELETE'
                });
                const data = await response.json();
                return data;
            }

            async createPerson(personData) {
                const response = await fetch(`${API_BASE_URL}/api/persons`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(personData)
                });
                const data = await response.json();
                return data;
            }

            async getStats() {
                const response = await fetch(`${API_BASE_URL}/api/stats`);
                const data = await response.json();
                return data.data || {};
            }

            async searchPersons(query) {
                const response = await fetch(`${API_BASE_URL}/api/search?query=${encodeURIComponent(query)}`);
                const data = await response.json();
                return data.data || [];
            }
        }

        const apiService = new ApiService();

        // Photo Avatar Component
        function PhotoAvatar({ person, size = 'md' }) {
            const [imageError, setImageError] = useState(false);

            const sizeClasses = {
                'sm': 'w-10 h-10 text-sm',
                'md': 'w-16 h-16 text-2xl',
                'lg': 'w-24 h-24 text-4xl',
                'xl': 'w-32 h-32 text-5xl'
            };

            const colorClass = person.gender === 'male'
                ? 'bg-blue-200 text-blue-600'
                : 'bg-pink-200 text-pink-600';

            const initials = person.name.split(' ').map(n => n[0]).join('').toUpperCase();

            // Construct full URL if it's a relative path
            let photoUrl = person.photoUrl;
            if (photoUrl && photoUrl.startsWith('/uploads/')) {
                photoUrl = `${API_BASE_URL}${photoUrl}`;
            }

            if (photoUrl && !imageError) {
                return (
                    <div className={`${sizeClasses[size]} rounded-full overflow-hidden`}>
                        <img
                            src={photoUrl}
                            alt={person.name}
                            className="photo-avatar"
                            onError={() => setImageError(true)}
                        />
                    </div>
                );
            }

            return (
                <div className={`${sizeClasses[size]} rounded-full ${colorClass} flex items-center justify-center font-bold`}>
                    {initials}
                </div>
            );
        }

        // Add Person Modal (with photo upload)
        function AddPersonModal({ onClose, onSave }) {
            const [formData, setFormData] = useState({
                name: '',
                nickName: '',
                gender: 'male',
                dateOfBirth: '',
                photoUrl: ''
            });
            const [selectedFile, setSelectedFile] = useState(null);
            const [previewUrl, setPreviewUrl] = useState(null);
            const [saving, setSaving] = useState(false);
            const [uploadMode, setUploadMode] = useState('upload');
            const [dragOver, setDragOver] = useState(false);
            const fileInputRef = useRef(null);

            const handleChange = (e) => {
                setFormData({
                    ...formData,
                    [e.target.name]: e.target.value
                });
            };

            const handleFileSelect = (e) => {
                const file = e.target.files[0];
                handleFile(file);
            };

            const handleFile = (file) => {
                if (file) {
                    const allowedTypes = ['image/jpeg', 'image/jpg', 'image/png', 'image/gif', 'image/webp'];
                    if (!allowedTypes.includes(file.type)) {
                        alert('Please select a valid image file (JPG, PNG, GIF, or WebP)');
                        return;
                    }
                    if (file.size > 5 * 1024 * 1024) {
                        alert('File size must be less than 5MB');
                        return;
                    }
                    setSelectedFile(file);
                    const reader = new FileReader();
                    reader.onloadend = () => setPreviewUrl(reader.result);
                    reader.readAsDataURL(file);
                }
            };

            const handleDragOver = (e) => {
                e.preventDefault();
                setDragOver(true);
            };

            const handleDragLeave = (e) => {
                e.preventDefault();
                setDragOver(false);
            };

            const handleDrop = (e) => {
                e.preventDefault();
                setDragOver(false);
                const file = e.dataTransfer.files[0];
                handleFile(file);
            };

            const clearPhoto = () => {
                setSelectedFile(null);
                setPreviewUrl(null);
                setFormData({ ...formData, photoUrl: '' });
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setSaving(true);
                try {
                    await onSave(formData, selectedFile);
                    onClose();
                } catch (error) {
                    alert('Failed to add member: ' + (error.message || error));
                } finally {
                    setSaving(false);
                }
            };

            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                    <div className="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto scrollbar-thin">
                        <div className="p-6 border-b">
                            <div className="flex justify-between items-center">
                                <h2 className="text-2xl font-bold text-gray-800">
                                    <i className="fas fa-user-plus mr-2 text-indigo-600"></i>
                                    Add Family Member
                                </h2>
                                <button onClick={onClose} className="text-gray-500 hover:text-gray-700 text-2xl">
                                    <i className="fas fa-times"></i>
                                </button>
                            </div>
                        </div>

                        <form onSubmit={handleSubmit} className="p-6">
                            <div className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        Full Name *
                                    </label>
                                    <input
                                        type="text"
                                        name="name"
                                        value={formData.name}
                                        onChange={handleChange}
                                        required
                                        className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500"
                                        placeholder="John Doe"
                                    />
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        Nickname
                                    </label>
                                    <input
                                        type="text"
                                        name="nickName"
                                        value={formData.nickName}
                                        onChange={handleChange}
                                        className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500"
                                        placeholder="Johnny"
                                    />
                                </div>

                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-2">
                                            Gender *
                                        </label>
                                        <select
                                            name="gender"
                                            value={formData.gender}
                                            onChange={handleChange}
                                            required
                                            className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                                            <option value="male">Male</option>
                                            <option value="female">Female</option>
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-2">
                                            Date of Birth
                                        </label>
                                        <input
                                            type="date"
                                            name="dateOfBirth"
                                            value={formData.dateOfBirth}
                                            onChange={handleChange}
                                            className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500"
                                        />
                                    </div>
                                </div>

                                <div className="border-t pt-4">
                                    <label className="block text-sm font-medium text-gray-700 mb-3">
                                        <i className="fas fa-camera mr-2"></i>
                                        Profile Photo (optional)
                                    </label>

                                    <div className="flex space-x-2 mb-4">
                                        <button
                                            type="button"
                                            onClick={() => { setUploadMode('upload'); clearPhoto(); }}
                                            className={`flex-1 py-2 px-4 rounded-lg font-semibold transition ${
                                                uploadMode === 'upload'
                                                    ? 'bg-indigo-600 text-white'
                                                    : 'bg-gray-200 text-gray-700 hover:bg-gray-300'
                                            }`}>
                                            <i className="fas fa-upload mr-2"></i>
                                            Upload File
                                        </button>
                                        <button
                                            type="button"
                                            onClick={() => { setUploadMode('url'); setSelectedFile(null); setPreviewUrl(null); }}
                                            className={`flex-1 py-2 px-4 rounded-lg font-semibold transition ${
                                                uploadMode === 'url'
                                                    ? 'bg-indigo-600 text-white'
                                                    : 'bg-gray-200 text-gray-700 hover:bg-gray-300'
                                            }`}>
                                            <i className="fas fa-link mr-2"></i>
                                            Photo URL
                                        </button>
                                    </div>

                                    {uploadMode === 'upload' ? (
                                        <div>
                                            <div
                                                className={`upload-zone rounded-lg p-8 text-center cursor-pointer ${
                                                    dragOver ? 'drag-over' : ''
                                                }`}
                                                onClick={() => fileInputRef.current.click()}
                                                onDragOver={handleDragOver}
                                                onDragLeave={handleDragLeave}
                                                onDrop={handleDrop}>
                                                <i className="fas fa-cloud-upload-alt text-5xl text-gray-400 mb-3"></i>
                                                <p className="text-gray-600 font-semibold mb-1">
                                                    Click to upload or drag and drop
                                                </p>
                                                <p className="text-sm text-gray-500">
                                                    PNG, JPG, GIF or WebP (max 5MB)
                                                </p>
                                                <input
                                                    ref={fileInputRef}
                                                    type="file"
                                                    accept="image/*"
                                                    onChange={handleFileSelect}
                                                    className="hidden"
                                                />
                                            </div>

                                            {selectedFile && (
                                                <div className="mt-3 p-3 bg-green-50 rounded-lg flex items-center justify-between">
                                                    <div className="flex items-center space-x-2">
                                                        <i className="fas fa-file-image text-green-600"></i>
                                                        <span className="text-sm font-medium text-gray-700">
                                                            {selectedFile.name}
                                                        </span>
                                                        <span className="text-xs text-gray-500">
                                                            ({(selectedFile.size / 1024).toFixed(1)} KB)
                                                        </span>
                                                    </div>
                                                    <button
                                                        type="button"
                                                        onClick={clearPhoto}
                                                        className="text-red-600 hover:text-red-700">
                                                        <i className="fas fa-times"></i>
                                                    </button>
                                                </div>
                                            )}
                                        </div>
                                    ) : (
                                        <div>
                                            <input
                                                type="url"
                                                name="photoUrl"
                                                value={formData.photoUrl}
                                                onChange={handleChange}
                                                className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500"
                                                placeholder="https://example.com/photo.jpg"
                                            />
                                            <p className="text-sm text-gray-500 mt-1">
                                                Enter a direct link to a photo
                                            </p>
                                        </div>
                                    )}

                                    {previewUrl && (
                                        <div className="mt-4">
                                            <p className="text-sm font-medium text-gray-700 mb-2">Preview:</p>
                                            <img
                                                src={previewUrl}
                                                alt="Preview"
                                                className="w-32 h-32 rounded-lg object-cover border-2 border-gray-200"
                                                onError={(e) => { e.target.style.display = 'none'; }}
                                            />
                                        </div>
                                    )}

                                    {uploadMode === 'url' && formData.photoUrl && (
                                        <div className="mt-4">
                                            <p className="text-sm font-medium text-gray-700 mb-2">Preview:</p>
                                            <img
                                                src={formData.photoUrl}
                                                alt="Preview"
                                                className="w-32 h-32 rounded-lg object-cover border-2 border-gray-200"
                                                onError={(e) => { e.target.style.display = 'none'; }}
                                            />
                                        </div>
                                    )}
                                </div>
                            </div>

                            <div className="flex space-x-3 mt-6 pt-6 border-t">
                                <button
                                    type="button"
                                    onClick={onClose}
                                    className="flex-1 bg-gray-200 text-gray-700 py-3 rounded-lg font-semibold hover:bg-gray-300 transition">
                                    Cancel
                                </button>
                                <button
                                    type="submit"
                                    disabled={saving}
                                    className="flex-1 bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition disabled:bg-gray-400">
                                    {saving ? (
                                        <>
                                            <i className="fas fa-spinner fa-spin mr-2"></i>
                                            Adding...
                                        </>
                                    ) : (
                                        <>
                                            <i className="fas fa-plus mr-2"></i>
                                            Add Member
                                        </>
                                    )}
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        // Edit Person Modal with Photo Upload
        function EditPersonModal({ person, onClose, onSave }) {
            const [formData, setFormData] = useState({
                name: person.name || '',
                nickName: person.nickName || '',
                gender: person.gender || 'male',
                dateOfBirth: person.dateOfBirth || '',
                photoUrl: person.photoUrl || ''
            });
            const [selectedFile, setSelectedFile] = useState(null);
            const [previewUrl, setPreviewUrl] = useState(null);
            const [saving, setSaving] = useState(false);
            const [uploadMode, setUploadMode] = useState('upload');
            const [dragOver, setDragOver] = useState(false);
            const fileInputRef = useRef(null);

            useEffect(() => {
                if (person.photoUrl) {
                    if (person.photoUrl.startsWith('/uploads/')) {
                        setPreviewUrl(`${API_BASE_URL}${person.photoUrl}`);
                    } else {
                        setPreviewUrl(person.photoUrl);
                    }
                    setFormData(fd => ({ ...fd, photoUrl: person.photoUrl }));
                } else {
                    setPreviewUrl(null);
                }
            }, [person.photoUrl]);

            const handleChange = (e) => {
                setFormData({
                    ...formData,
                    [e.target.name]: e.target.value
                });
            };

            const handleFileSelect = (e) => {
                const file = e.target.files[0];
                handleFile(file);
            };

            const handleFile = (file) => {
                if (file) {
                    const allowedTypes = ['image/jpeg', 'image/jpg', 'image/png', 'image/gif', 'image/webp'];
                    if (!allowedTypes.includes(file.type)) {
                        alert('Please select a valid image file (JPG, PNG, GIF, or WebP)');
                        return;
                    }

                    if (file.size > 5 * 1024 * 1024) {
                        alert('File size must be less than 5MB');
                        return;
                    }

                    setSelectedFile(file);

                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setPreviewUrl(reader.result);
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleDragOver = (e) => {
                e.preventDefault();
                setDragOver(true);
            };

            const handleDragLeave = (e) => {
                e.preventDefault();
                setDragOver(false);
            };

            const handleDrop = (e) => {
                e.preventDefault();
                setDragOver(false);
                const file = e.dataTransfer.files[0];
                handleFile(file);
            };

            const handleDeletePhoto = async () => {
                if (!confirm('Are you sure you want to delete this photo?')) {
                    return;
                }

                setSaving(true);
                try {
                    // Delete on server via dedicated endpoint
                    await apiService.deletePhoto(person.id);

                    // Persist deletion to person record (ensure parent reloads / data refreshed)
                    await onSave(person.id, { photoUrl: '' });

                    // Update local modal state
                    setPreviewUrl(null);
                    setSelectedFile(null);
                    setFormData({ ...formData, photoUrl: '' });

                    alert('Photo deleted successfully');
                } catch (error) {
                    alert('Failed to delete photo: ' + (error.message || error));
                } finally {
                    setSaving(false);
                }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setSaving(true);

                try {
                    let uploadedPhotoUrl = null;

                    // If user selected a file, upload it first and capture returned URL
                    if (selectedFile && uploadMode === 'upload') {
                        const uploadResult = await apiService.uploadPhoto(person.id, selectedFile);
                        // support flexible response shapes
                        uploadedPhotoUrl = uploadResult?.data?.photoUrl || uploadResult?.photoUrl || uploadResult?.url || null;

                        if (!uploadedPhotoUrl && !(uploadResult && uploadResult.success)) {
                            throw new Error(uploadResult?.error || 'Photo upload failed');
                        }

                        // normalize preview to full URL
                        if (uploadedPhotoUrl) {
                            const preview = uploadedPhotoUrl.startsWith('/uploads/') ? `${API_BASE_URL}${uploadedPhotoUrl}` : uploadedPhotoUrl;
                            setPreviewUrl(preview);
                        }
                    }

                    // Build update payload - include photoUrl if available (either typed URL or uploaded)
                    const updateData = { ...formData };
                    if (uploadedPhotoUrl) {
                        updateData.photoUrl = uploadedPhotoUrl;
                    }

                    // If uploadMode == 'url', formData.photoUrl already contains the typed URL
                    await onSave(person.id, updateData);
                    onClose();
                } catch (error) {
                    alert('Failed to save: ' + (error.message || error));
                } finally {
                    setSaving(false);
                }
            };


            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                    <div className="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto scrollbar-thin">
                        <div className="p-6 border-b">
                            <div className="flex justify-between items-center">
                                <h2 className="text-2xl font-bold text-gray-800">
                                    <i className="fas fa-edit mr-2 text-indigo-600"></i>
                                    Edit Person
                                </h2>
                                <button onClick={onClose} className="text-gray-500 hover:text-gray-700 text-2xl">
                                    <i className="fas fa-times"></i>
                                </button>
                            </div>
                        </div>

                        <form onSubmit={handleSubmit} className="p-6">
                            <div className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        Full Name *
                                    </label>
                                    <input
                                        type="text"
                                        name="name"
                                        value={formData.name}
                                        onChange={handleChange}
                                        required
                                        className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500"
                                        placeholder="John Doe"
                                    />
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        Nickname
                                    </label>
                                    <input
                                        type="text"
                                        name="nickName"
                                        value={formData.nickName}
                                        onChange={handleChange}
                                        className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500"
                                        placeholder="Johnny"
                                    />
                                </div>

                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-2">
                                            Gender *
                                        </label>
                                        <select
                                            name="gender"
                                            value={formData.gender}
                                            onChange={handleChange}
                                            required
                                            className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                                            <option value="male">Male</option>
                                            <option value="female">Female</option>
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-2">
                                            Date of Birth
                                        </label>
                                        <input
                                            type="date"
                                            name="dateOfBirth"
                                            value={formData.dateOfBirth}
                                            onChange={handleChange}
                                            className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500"
                                        />
                                    </div>
                                </div>

                                <div className="border-t pt-4">
                                    <label className="block text-sm font-medium text-gray-700 mb-3">
                                        <i className="fas fa-camera mr-2"></i>
                                        Profile Photo
                                    </label>

                                    <div className="flex space-x-2 mb-4">
                                        <button
                                            type="button"
                                            onClick={() => setUploadMode('upload')}
                                            className={`flex-1 py-2 px-4 rounded-lg font-semibold transition ${
                                                uploadMode === 'upload'
                                                    ? 'bg-indigo-600 text-white'
                                                    : 'bg-gray-200 text-gray-700 hover:bg-gray-300'
                                            }`}>
                                            <i className="fas fa-upload mr-2"></i>
                                            Upload File
                                        </button>
                                        <button
                                            type="button"
                                            onClick={() => setUploadMode('url')}
                                            className={`flex-1 py-2 px-4 rounded-lg font-semibold transition ${
                                                uploadMode === 'url'
                                                    ? 'bg-indigo-600 text-white'
                                                    : 'bg-gray-200 text-gray-700 hover:bg-gray-300'
                                            }`}>
                                            <i className="fas fa-link mr-2"></i>
                                            Photo URL
                                        </button>
                                    </div>

                                    {uploadMode === 'upload' ? (
                                        <div>
                                            <div
                                                className={`upload-zone rounded-lg p-8 text-center cursor-pointer ${
                                                    dragOver ? 'drag-over' : ''
                                                }`}
                                                onClick={() => fileInputRef.current.click()}

// Family Tree Visualization Component
function FamilyTree({ data, onNodeClick, highlightPath }) {
    const svgRef = useRef();

    useEffect(() => {
        if (!data || !data.nodes.length) return;

        const width = 1200;
        const height = 800;
        const margin = { top: 40, right: 120, bottom: 40, left: 120 };
        const nodeRadius = 35;

        d3.select(svgRef.current).selectAll('*').remove();

        const svg = d3.select(svgRef.current)
            .attr('width', '100%')
            .attr('height', height)
            .attr('viewBox', `0 0 ${width} ${height}`);

        const g = svg.append('g')
            .attr('transform', `translate(${margin.left},${margin.top})`);

        const rootNodes = data.nodes.filter(node => {
            return !data.relationships.some(r =>
                (r.type === 'child_of' && r.from === node.id) ||
                (r.type === 'has_child' && r.to === node.id)
            );
        });

        const root = {
            id: 'root',
            name: 'Family Tree',
            children: buildHierarchy(rootNodes[0]?.id || data.nodes[0].id, data)
        };

        const treeLayout = d3.tree()
            .size([width - margin.left - margin.right, height - margin.top - margin.bottom])
            .separation((a, b) => (a.parent === b.parent ? 2 : 3));

        const hierarchy = d3.hierarchy(root);
        const treeData = treeLayout(hierarchy);

        // Draw links
        g.selectAll('.tree-link')
            .data(treeData.links())
            .enter()
            .append('path')
            .attr('class', d => {
                const sourceId = d.source.data.id;
                const targetId = d.target.data.id;
                if (highlightPath && highlightPath.includes(sourceId) && highlightPath.includes(targetId)) {
                    return 'tree-link path-highlight';
                }
                return 'tree-link';
            })
            .attr('d', d3.linkVertical()
                .x(d => d.x)
                .y(d => d.y));

        // Draw nodes
        const nodes = g.selectAll('.tree-node')
            .data(treeData.descendants().filter(d => d.data.id !== 'root'))
            .enter()
            .append('g')
            .attr('class', 'tree-node')
            .attr('transform', d => `translate(${d.x},${d.y})`)
            .style('cursor', 'pointer')
            .on('click', (event, d) => onNodeClick(d.data));

        // Add circular background for image
        nodes.append('circle')
            .attr('r', nodeRadius)
            .attr('fill', d => d.data.gender === 'male' ? '#dbeafe' : '#fce7f3')
            .attr('stroke', d => {
                if (highlightPath && highlightPath.includes(d.data.id)) {
                    return '#fbbf24';
                }
                return d.data.gender === 'male' ? '#3b82f6' : '#ec4899';
            })
            .attr('stroke-width', d => highlightPath && highlightPath.includes(d.data.id) ? 4 : 2)
            .attr('class', d => highlightPath && highlightPath.includes(d.data.id) ? 'path-highlight' : '');

        // Add clipping path for circular images
        svg.append('defs').selectAll('clipPath')
            .data(treeData.descendants().filter(d => d.data.id !== 'root'))
            .enter()
            .append('clipPath')
            .attr('id', d => `clip-${d.data.id}`)
            .append('circle')
            .attr('r', nodeRadius - 2);

// Add profile images
nodes.append('image')
    .attr('x', -nodeRadius)
    .attr('y', -nodeRadius)
    .attr('width', nodeRadius * 2)
    .attr('height', nodeRadius * 2)
    .attr('clip-path', d => `url(#clip-${d.data.id})`)
    .attr('href', d => {
        if (!d.data.photoUrl) {
            return getInitialsSVG(d.data.name, d.data.gender);
        }
        let photoUrl = d.data.photoUrl;
        if (photoUrl.startsWith('/uploads/')) {
            photoUrl = `${API_BASE_URL}${photoUrl}`;
        }
        return photoUrl;
    })
    .attr('preserveAspectRatio', 'xMidYMid slice')
    .on('error', function() {
        const datum = d3.select(this).datum();
        d3.select(this).remove();
        const parent = d3.select(this.parentNode);
        parent.append('text')
            .attr('text-anchor', 'middle')
            .attr('dy', '0.3em')
            .attr('font-size', '18px')
            .attr('font-weight', '600')
            .attr('fill', datum.data.gender === 'male' ? '#3b82f6' : '#ec4899')
            .text(getInitials(datum.data.name));
    });

        // Add name labels below nodes
        nodes.append('text')
            .attr('dy', nodeRadius + 20)
            .attr('text-anchor', 'middle')
            .attr('font-size', '12px')
            .attr('font-weight', '600')
            .attr('fill', '#1e293b')
            .text(d => d.data.name);

        // Add year labels
        nodes.append('text')
            .attr('dy', nodeRadius + 35)
            .attr('text-anchor', 'middle')
            .attr('font-size', '10px')
            .attr('fill', '#64748b')
            .text(d => d.data.dateOfBirth ? new Date(d.data.dateOfBirth).getFullYear() : '');

    }, [data, highlightPath]);

    function getInitials(name) {
        return name.split(' ').map(n => n[0]).join('').toUpperCase();
    }

    function getInitialsSVG(name, gender) {
        const initials = getInitials(name);
        const bgColor = gender === 'male' ? '#dbeafe' : '#fce7f3';
        const textColor = gender === 'male' ? '#3b82f6' : '#ec4899';

        const svg = `
            <svg xmlns="http://www.w3.org/2000/svg" width="70" height="70">
                <rect width="70" height="70" fill="${bgColor}"/>
                <text x="35" y="40" text-anchor="middle" font-size="28" font-weight="600" fill="${textColor}">${initials}</text>
            </svg>
        `;
        return 'data:image/svg+xml;base64,' + btoa(svg);
    }

    function buildHierarchy(nodeId, data) {
        const node = data.nodes.find(n => n.id === nodeId);
        if (!node) return [];

        const children = data.relationships
            .filter(r => r.from === nodeId && r.type === 'has_child')
            .map(r => {
                const child = data.nodes.find(n => n.id === r.to);
                return {
                    ...child,
                    children: buildHierarchy(r.to, data)
                };
            });

        return children.length > 0 ? children : undefined;
    }

    return (
        <div className="bg-white rounded-lg shadow-xl p-6 overflow-auto scrollbar-thin">
            <svg ref={svgRef}></svg>
        </div>
    );
}

                                ) : pathResult.length === 0 && (
                                    <div className="text-center text-gray-600">
                                        <i className="fas fa-times-circle text-4xl text-red-500 mb-2"></i>
                                        <p className="font-semibold">No connection found between selected persons</p>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>

                    <div className="max-w-7xl mx-auto mb-6">
                        <FamilyTree
                            data={{ nodes: persons, relationships }}
                            onNodeClick={handleNodeClick}
                            highlightPath={highlightPath}
                        />
                    </div>

                    {showProfile && (
                        <PersonProfile
                            person={selectedPerson}
                            onClose={() => setShowProfile(false)}
                            onEdit={handleEdit}
                            relationships={relationships}
                            allPersons={persons}
                        />
                    )}

                    {showEditModal && (
                        <EditPersonModal
                            person={selectedPerson}
                            onClose={() => setShowEditModal(false)}
                            onSave={handleSave}
                        />
                    )}

                    {showAddModal && (
                        <AddPersonModal
                            onClose={() => setShowAddModal(false)}
                            onSave={handleAddPerson}
                        />
                    )}

                    <div className="max-w-7xl mx-auto mt-6 grid grid-cols-1 md:grid-cols-4 gap-6">
                        <div className="bg-white rounded-lg shadow-lg p-6 text-center">
                            <i className="fas fa-users text-4xl text-indigo-600 mb-2"></i>
                            <p className="text-3xl font-bold text-gray-800">{stats.totalPersons || 0}</p>
                            <p className="text-gray-600">Total Members</p>
                        </div>
                        <div className="bg-white rounded-lg shadow-lg p-6 text-center">
                            <i className="fas fa-mars text-4xl text-blue-600 mb-2"></i>
                            <p className="text-3xl font-bold text-gray-800">{stats.maleCount || 0}</p>
                            <p className="text-gray-600">Male Members</p>
                        </div>
                        <div className="bg-white rounded-lg shadow-lg p-6 text-center">
                            <i className="fas fa-venus text-4xl text-pink-600 mb-2"></i>
                            <p className="text-3xl font-bold text-gray-800">{stats.femaleCount || 0}</p>
                            <p className="text-gray-600">Female Members</p>
                        </div>
                        <div className="bg-white rounded-lg shadow-lg p-6 text-center">
                            <i className="fas fa-link text-4xl text-green-600 mb-2"></i>
                            <p className="text-3xl font-bold text-gray-800">{stats.totalRelationships || 0}</p>
                            <p className="text-gray-600">Relationships</p>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
